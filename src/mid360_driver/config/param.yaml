mid360_driver:
    ros__parameters:
        lidar_topic: /livox/lidar
        lidar_frame: livox_frame
        imu_topic: /livox/imu
        imu_frame: imu_frame
        lidar_publish_time_interval: 0.1
        # host_ip 须等于雷达里配置的目的 IP,且是本机接雷达网卡的地址,否则 topic 存在但无数据
        # 实测雷达 192.168.1.166 -> 目的 IP 192.168.1.10(网卡另保留 .50 作旧地址)
        host_ip: 192.168.1.10
        is_topic_name_with_lidar_ip: false # 是否在话题名后面加雷达ip，可以用于区分多个雷达
