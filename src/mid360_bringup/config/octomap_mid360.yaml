/**:
  octomap_server:
    ros__parameters:
      # ── 坐标系 ────────────────────────────────────────────────────────────
      # 世界系 = point_lio 的 odom 系。mapping_mid360.launch.py 没覆盖
      # odom_header_frame_id,用的是 point_lio 默认值 camera_init。
      frame_id: camera_init
      # base_frame_id 只在 filter_ground_plane=true 时才用到(下面关掉了)。
      base_frame_id: body

      # ── 输入点云 ──────────────────────────────────────────────────────────
      # launch 里把 cloud_in 重映射到 /cloud_registered_body。
      # 必须是机体系点云:octomap_server 取
      #   lookupTransform(frame_id, cloud.header.frame_id).translation
      # 作为射线起点。若直接喂世界系的 /cloud_registered(frame_id 已是
      # camera_init),变换是单位阵 → 射线全从世界原点射出,占据体素仍然正确
      # (所以 rviz 里看着“有地图”),但自由空间被整片刷错,墙会被从背面清空。
      # 需要的 tf:camera_init → body,由 point_lio 的激光雷达里程计广播。

      # ── 建图精度 / 性能 ───────────────────────────────────────────────────
      # 体素边长。0.1 m 对 Mid-360 的密度够用;调大省内存和 CPU,
      # 也会同时改变 /projected_map 的分辨率。
      resolution: 0.1
      sensor_model:
        # 超过该距离的点只用于给射线截断,不作为占据端点插入。
        # Mid-360 的 det_range 是 100 m,-1 表示不限制 —— 那样 10 Hz 的
        # 射线投射量会非常大,而且地图会无限膨胀,实测没必要。
        max_range: 20.0
        hit: 0.7        # 命中一次的概率增量
        miss: 0.4       # 穿过一次的概率减量
        min: 0.12       # 概率下限钳位(低于此值当作空闲)
        max: 0.97       # 概率上限钳位(到达此值就固定为占据)

      # ── 二维投影(/projected_map,nav2 / costmap 用)─────────────────────────
      # 只把这个高度带内的体素投影成 OccupancyGrid
      occupancy_min_z: -2.0
      occupancy_max_z: 3.0
      incremental_2D_projection: true

      # ── 其他 ──────────────────────────────────────────────────────────────
      filter_ground_plane: false   # 不做地面分割:地面会被当作占据体素(2D 投影里正好当地板)
      filter_speckles: true        # 去掉孤立噪点体素
      compress_map: true           # /octomap_binary 无损压缩
      publish_free_space: false    # 空闲体素 MarkerArray,带宽开销大,默认关
      latch: false                 # 实时建图,不给后加入的订阅者补发
