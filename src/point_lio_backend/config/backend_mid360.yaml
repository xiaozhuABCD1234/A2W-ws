/**:
  ros__parameters:
    # ── 坐标系 / 话题 ─────────────────────────────────────────────────────
    world_frame: map
    odom_frame: camera_init
    body_frame: body
    odom_topic: /aft_mapped_to_init
    cloud_topic: /cloud_registered_body
    path_topic: /backend/path
    odom_out_topic: /backend/odom
    map_topic: /backend/map_points
    loop_marker_topic: /backend/loop_markers
    status_topic: /backend/status

    # ── 关键帧 / 子图 ─────────────────────────────────────────────────────
    keyframe.min_distance: 1.0
    keyframe.min_rotation_deg: 10.0
    keyframe.max_interval_sec: 2.0
    keyframe.min_interval_sec: 0.3
    keyframe.submap_frames: 4
    keyframe.submap_voxel: 0.2
    keyframe.max_keyframes: 2000

    # ── Scan Context ──────────────────────────────────────────────────────
    # Mid-360 是 360°×(-7°~52°) 雷达，SC 的扇区本来就覆盖完整 2π，旋转不变性
    # 正是靠"360° + 扇区循环移位"成立，所以不要为它加 FOV mask。
    # 真正按 Mid-360 调的是半径：10 Hz 约 1.9 万点/帧，40 m 外环 bin 太稀；
    # 室内/园区 30 m 足够（octomap 也只用 15 m），需要远距离再调大。
    # rings×sectors = 20×60 -> 环宽 1.5 m、扇区 6°，与 SC 论文一致。
    scan_context.rings: 20
    scan_context.sectors: 60
    scan_context.max_radius: 30.0
    scan_context.ring_key_threshold: 0.15
    scan_context.sc_distance_threshold: 0.35
    scan_context.top_candidates: 5
    scan_context.min_index_gap: 20
    scan_context.min_time_gap_sec: 10.0
    # 累计行程下限：静止时 SC 会不断匹配早期关键帧，产生"原地不动"的假回环
    # （纠偏量≈0，无害但会刷屏 /backend/status 的 loops）。真实回环至少要走过这段路。
    scan_context.min_travel_m: 3.0

    # ── GICP 校验 ─────────────────────────────────────────────────────────
    icp.coarse_correspondence: 2.0
    icp.max_correspondence: 1.0
    # 迭代与点数上限:实测 5000 点 × 8 候选 × 两级 GICP 要 0.7~3.3 s/关键帧,
    # 会把 1 s/关键帧 的节奏拖垮(队列丢帧)。回环匹配不需要全分辨率:
    # 0.35 m 体素把子图降到 ~1200 点,精度足够而耗时降一个数量级。
    icp.max_iterations: 20
    icp.coarse_iterations: 10
    icp.match_voxel: 0.35
    icp.max_match_points: 1500
    icp.stop_at_first: true
    # 单次 detect 的总预算（含 SC + 全部 GICP）。超预算就放弃本次回环，
    # 保证 worker 不会因为一次坏候选把整个关键帧节奏拖垮（0 = 不限）。
    icp.time_budget_ms: 400.0
    icp.max_fitness: 0.10
    icp.min_inlier_ratio: 0.6
    icp.max_correction_trans: 5.0
    icp.max_correction_rot_deg: 30.0

    # ── 位姿图 ────────────────────────────────────────────────────────────
    graph.odom_trans_sigma: 0.02
    graph.odom_rot_sigma_deg: 0.5
    graph.loop_trans_sigma: 0.10
    graph.loop_rot_sigma_deg: 1.5
    # 注意量纲：残差已按 1/σ 加权（平移 1/0.10 = ×10 每米），Huber δ 也在
    # 加权单位里。δ=1 会把 >0.1 m 的回环当外点线性降权，单条回环几乎拉不回来；
    # 10 对应 ~1 m 内保持二次、之外线性，配合优化后的残差门控剔外点。
    graph.huber_delta: 10.0
    graph.max_iterations: 50
    graph.num_threads: 2
    graph.max_loop_residual_trans: 0.5
    graph.max_loop_residual_rot_deg: 5.0
    graph.remove_outlier_loops: true

    # ── 输出 ──────────────────────────────────────────────────────────────
    output.map_publish_period: 2.0
    output.map_voxel: 0.2
    output.correction_tau: 1.5
    output.publish_odom: true
    output.publish_raw_path: false

    # 退出时把 **回环校正后的 map 系点云** 写成 PCD(PCD/backend_map.pcd)。
    # 和 point_lio 的 pcd_save 不是同一份:那份由 vendored 包在 camera_init 系写,
    # 没有回环纠正;这份用各关键帧**当前** pose_opt 全量重建,位姿图拉直轨迹的
    # 效果会体现在文件里。两者叠起来看墙厚,就能判断回环到底改了多少。
    # 注意密度:关键帧点云是 submap.submap_frames 帧、submap_voxel 0.2 m 抽稀过的,
    # 比前端那份稀;要更密调小 keyframe.submap_voxel(代价是后端 CPU/内存)。
    output.save_pcd: true
    output.pcd_path: PCD/backend_map.pcd    # 相对运行 launch 的目录(P8 约定)
    # >0: 每 N 秒覆盖写一次(kill -9 / 断电也能留下最近一份);0 = 只在退出时写。
    # 写入成本是 O(关键帧数) 的全量重建(100 帧约几十 ms,2000 帧数百 ms),别设太小。
    output.pcd_save_period: 0.0

    # ── 运行时 ────────────────────────────────────────────────────────────
    runtime.pending_clouds: 2
    runtime.reset_on_jump_m: 2.0
    runtime.stamp_tolerance_sec: 0.05
    runtime.max_loop_solve_sec: 0.5
    runtime.profile: false          # true: 打印每个关键帧各阶段耗时(验收/调参用)
