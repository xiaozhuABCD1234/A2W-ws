/**:
  ros__parameters:
    # 合成回放专用：比线上默认更灵敏，保证短回环能在几十秒内收敛。
    world_frame: map
    odom_frame: camera_init
    body_frame: body
    odom_topic: /aft_mapped_to_init
    cloud_topic: /cloud_registered_body
    path_topic: /backend/path
    odom_out_topic: /backend/odom
    map_topic: /backend/map_points
    loop_marker_topic: /backend/loop_markers
    status_topic: /backend/status

    keyframe.min_distance: 0.5
    keyframe.min_rotation_deg: 8.0
    keyframe.max_interval_sec: 1.0
    keyframe.min_interval_sec: 0.2
    keyframe.submap_frames: 3
    keyframe.submap_voxel: 0.15
    keyframe.max_keyframes: 2000

    scan_context.rings: 20
    scan_context.sectors: 60
    scan_context.max_radius: 30.0
    scan_context.ring_key_threshold: 0.2
    scan_context.sc_distance_threshold: 0.35
    scan_context.top_candidates: 8
    scan_context.min_index_gap: 12
    scan_context.min_time_gap_sec: 5.0

    icp.coarse_correspondence: 2.5
    icp.max_correspondence: 1.0
    icp.max_iterations: 40
    icp.max_fitness: 0.15
    icp.min_inlier_ratio: 0.5
    icp.max_correction_trans: 5.0
    icp.max_correction_rot_deg: 35.0

    graph.odom_trans_sigma: 0.02
    graph.odom_rot_sigma_deg: 0.5
    graph.loop_trans_sigma: 0.15
    graph.loop_rot_sigma_deg: 2.0
    graph.huber_delta: 10.0
    graph.max_iterations: 50
    graph.num_threads: 2
    graph.max_loop_residual_trans: 0.6
    graph.max_loop_residual_rot_deg: 6.0
    graph.remove_outlier_loops: true

    output.map_publish_period: 0.5
    output.map_voxel: 0.2
    output.correction_tau: 0.0
    output.publish_odom: true
    output.publish_raw_path: true

    runtime.pending_clouds: 5
    runtime.reset_on_jump_m: 3.0
    runtime.stamp_tolerance_sec: 0.05
    runtime.max_loop_solve_sec: 1.0
