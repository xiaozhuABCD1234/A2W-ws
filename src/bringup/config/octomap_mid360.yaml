/**:
  octomap_server:
    ros__parameters:
      # ── 坐标系 ───────────────────────────────────────
      # 世界系 = point_lio 的 odom 系(默认 camera_init)。
      frame_id: camera_init
      base_frame_id: body   # 仅 filter_ground_plane=true 时用到(已关)

      # ── 输入点云 ─────────────────────────────────────
      # 必须是机体系点云(cloud_in -> /cloud_registered_body):射线起点取
      # lookupTransform(frame_id, cloud frame).translation,喂世界系时变换为
      # 单位阵 → 射线全从世界原点射出,自由空间整片刷错。需要 point_lio 广播
      # 的 camera_init -> body tf。

      # ── 建图精度 / 性能 ───────────────────────────────
      # 0.1 -> 0.2 为降耗时(重影已由 P4 在源头修掉):0.1 时每帧插入 ~82 ms,
      # 接近 10 Hz 的 100 ms 预算;耗时 ∝ 1/resolution。代价是 0.2 m 以下薄结构
      # (栅杆/薄墙)会漏。本项同时决定 /projected_map 的分辨率。
      resolution: 0.2
      sensor_model:
        # 超距点只用于截断射线,不作为占据端点。20 -> 15:远处点噪声大,
        # 是“空中碎影”主要来源,也限射线长度省 CPU。
        max_range: 15.0

        # 残余噪声收尾(重影主力靠 P4)。更新量为对数几率:
        # hit 0.65 → 约 4.8 次命中才从 0 推满(压一划而过的噪声);
        # max 0.95 + miss 0.4 → 从满占据擦回 min 约 12 次 miss,残影退更快。
        # miss 别动:调大擦除变慢,调小会让稀疏墙面一闪一闪。
        hit: 0.65
        miss: 0.4
        min: 0.12
        max: 0.95

        # 高转速下若仍是明确两层,问题在位姿估计:去扫 point_lio 的
        # common.time_lag_imu_to_lidar(±0.02),别再压 octomap 参数。

      # ── 二维投影(/projected_map,nav2/costmap 用)──────
      # 只把该高度带内的体素投影;不影响 3D octomap,治不了 3D 重影。
      occupancy_min_z: -2.0
      occupancy_max_z: 3.0
      incremental_2D_projection: false

      # ── 其他 ─────────────────────────────────────────
      filter_ground_plane: false   # 地面当占据体素(2D 投影里正好当地板)
      filter_speckles: true        # 去孤立噪点体素
      compress_map: true           # /octomap_binary 无损压缩
      publish_free_space: false    # 空闲体素带宽开销大,默认关
      # latch=true → /projected_map 用 transient_local：nav2 map_saver / costmap
      # static layer 均为 transient_local 订阅，volatile 与之 QoS 不兼容收不到；
      # 晚加入的订阅者(RViz Map 显示、occ-save 存图)也能拿到最近一版地图。
      latch: true
