/**:
  ros__parameters:
    world_frame: map
    ground_topic: /ground_segmentation/ground
    nonground_topic: /ground_segmentation/nonground
    map_topic: /costmap_2d/grid

    runtime.stamp_tolerance: 0.05
    runtime.publish_period_ms: 100
    runtime.decay_period_ms: 200
    runtime.tf_timeout_ms: 100

    window.resolution: 0.05
    window.width: 10.0
    window.height: 10.0
    window.recenter_distance: 0.6
    window.max_range: 8.0

    z.ground_relative: true
    z.ground_radius: 4.0
    z.ground_percentile: 0.15
    z.ground_smoothing: 0.3
    z.clear_min: -0.30
    z.clear_max: 1.30
    z.obstacle_min: 0.05
    z.obstacle_max: 1.50

    fuse.occupied_log_odds: 0.85
    fuse.free_log_odds: -0.12
    fuse.min_log_odds: -3.0
    fuse.max_log_odds: 3.5
    fuse.ray_block_probability: 0.90
    fuse.free_ray_occupied_delta: 0.25
    fuse.blind_hold_sec: 2.0
    fuse.occupied_decay: 0.12
    fuse.free_decay: 0.02
    fuse.min_component_cells: 2
    fuse.raycast_dedupe_deg: 0.5
